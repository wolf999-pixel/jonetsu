name: jonetsu
description: JŌNETSU - plateforme sociale OTAKU futuriste.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  flutter_riverpod: ^2.5.0
  go_router: ^17.2.3
  flutter_svg: ^2.0.7
  animations: ^2.0.8
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1
  firebase_messaging: ^15.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  socket_io_client: ^3.1.4
  dio: ^5.4.0
  intl: ^0.18.1
  flutter_local_notifications: ^18.0.1
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  build_runner: ^2.5.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/LOGO.jpg"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/placeholders/
    - assets/animations/
    - assets/images/
